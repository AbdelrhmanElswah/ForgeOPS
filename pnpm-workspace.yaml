packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default (supply-chain protection).
# Only these packages may run them; each one only sets up its native binary.
allowBuilds:
  '@swc/core': true
  esbuild: true
  prisma: true
  '@prisma/engines': true
  # Explicitly denied (CI fails on any undecided package):
  # install telemetry pulled in by swagger-ui; nothing breaks without it.
  '@scarf/scarf': false
  # optional native accelerator for BullMQ's msgpackr; it falls back to pure JavaScript.
  msgpackr-extract: false
  # import resolver used by Next's ESLint preset; its script only re-downloads a native binary
  # when the platform package is missing, and pnpm already installs that package.
  unrs-resolver: false
